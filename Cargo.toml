[package]
name = "macos-media-toolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skywhale/macos-media-toolkit"
description = "Camera, screen capture and hardware HEVC codecs for macOS."
keywords = ["macos", "avfoundation", "screencapturekit", "videotoolbox", "hevc"]
categories = ["multimedia::video", "multimedia::encoding", "os::macos-apis", "api-bindings"]

# docs.rs builds on Linux, where everything but `hevc` is cfg'd out.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
anyhow = "1"
log = "0.4"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = "0.16"

[dev-dependencies]
env_logger = "0.11"

[lints.clippy]
todo = "warn"
